<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบรายงานสถานการณ์น้ำท่วม Lab & รังสี เขต 4</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

    <main class="w-full max-w-lg glass-card rounded-2xl p-5 shadow-2xl space-y-5 my-4">
        <div class="border-b border-slate-700/80 pb-4 text-center">
            <div class="inline-flex p-3 bg-sky-500/10 border border-sky-500/30 rounded-full text-sky-400 mb-2">
                <i data-lucide="clipboard-check" class="w-8 h-8"></i>
            </div>
            <h1 class="text-base font-bold text-white">แบบรายงานสถานการณ์ความเสี่ยงน้ำท่วม</h1>
            <p class="text-xs text-slate-400 mt-1">งานห้องปฏิบัติการพยาธิวิทยา & รังสีวิทยา (เขตสุขภาพที่ 4)</p>
        </div>

        <form id="report-form" class="space-y-4 text-xs">
            <div class="space-y-3">
                <label class="block font-bold text-slate-300 flex items-center gap-1.5">
                    <i data-lucide="building-2" class="w-4 h-4 text-sky-400"></i> 1. ข้อมูลสถานที่ / หน่วยงาน
                </label>
                <div>
                    <label class="block text-slate-400 mb-1">ชื่อโรงพยาบาล / หน่วยงาน</label>
                    <input type="text" id="hospital_name" required placeholder="เช่น รพ.เสาไห้ หรือ รพ.สต.บ้านหมอ" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500 font-semibold">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-slate-400 mb-1">จังหวัด (เขต 4)</label>
                        <select id="province" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500">
                            <option value="สระบุรี">สระบุรี</option>
                            <option value="พระนครศรีอยุธยา">พระนครศรีอยุธยา</option>
                            <option value="อ่างทอง">อ่างทอง</option>
                            <option value="สิงห์บุรี">สิงห์บุรี</option>
                            <option value="ลพบุรี">ลพบุรี</option>
                            <option value="ชัยนาท">ชัยนาท</option>
                            <option value="นนทบุรี">นนทบุรี</option>
                            <option value="ปทุมธานี">ปทุมธานี</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1">อำเภอ</label>
                        <input type="text" id="district" required placeholder="เช่น เสาไห้, เมืองสระบุรี" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500">
                    </div>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-800">
                <label class="block font-bold text-slate-300 mb-1 flex items-center gap-1.5">
                    <i data-lucide="shield-alert" class="w-4 h-4 text-sky-400"></i> 2. ประเมินระดับความเสี่ยงภาพรวม
                </label>
                <div class="grid grid-cols-3 gap-2">
                    <label class="border border-slate-700 bg-slate-900 p-2.5 rounded-xl text-center cursor-pointer hover:border-emerald-500 flex flex-col items-center gap-1">
                        <input type="radio" name="risk_level" value="GREEN" checked class="accent-emerald-500">
                        <span class="font-bold text-emerald-400">🟢 ปกติ</span>
                    </label>
                    <label class="border border-slate-700 bg-slate-900 p-2.5 rounded-xl text-center cursor-pointer hover:border-amber-500 flex flex-col items-center gap-1">
                        <input type="radio" name="risk_level" value="YELLOW" class="accent-amber-500">
                        <span class="font-bold text-amber-400">🟡 เตือนภัย</span>
                    </label>
                    <label class="border border-slate-700 bg-slate-900 p-2.5 rounded-xl text-center cursor-pointer hover:border-rose-500 flex flex-col items-center gap-1">
                        <input type="radio" name="risk_level" value="RED" class="accent-rose-500">
                        <span class="font-bold text-rose-400">🔴 วิกฤต</span>
                    </label>
                </div>
            </div>

            <div class="space-y-2 pt-2 border-t border-slate-800">
                <label class="block font-bold text-slate-300 mb-1 flex items-center gap-1.5">
                    <i data-lucide="list-checks" class="w-4 h-4 text-sky-400"></i> 3. รายการตรวจสอบความพร้อม (Checklist)
                </label>
                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk_water" class="w-4 h-4 rounded accent-sky-500">
                        <span class="text-slate-300">น้ำท่วมขังหรือเอ่อล้นบริเวณรอบอาคาร</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk_power" class="w-4 h-4 rounded accent-sky-500">
                        <span class="text-slate-300">ตัดระบบไฟฟ้าหลัก / ใช้ไฟสำรอง</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk_lab_move" class="w-4 h-4 rounded accent-sky-500">
                        <span class="text-slate-300">ยกเครื่องมือ Lab / สำรองน้ำยาขึ้นชั้นสูงแล้ว</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="chk_rad_stop" class="w-4 h-4 rounded accent-sky-500">
                        <span class="text-slate-300">งดให้บริการเครื่อง X-Ray/CT (ตัดไฟคลุมพลาสติก)</span>
                    </label>
                </div>
            </div>

            <div class="pt-2 border-t border-slate-800">
                <label class="block font-bold text-slate-300 mb-1 flex items-center gap-1.5">
                    <i data-lucide="message-square" class="w-4 h-4 text-sky-400"></i> 4. รายละเอียดสถานการณ์เพิ่มเติม
                </label>
                <textarea id="water_situation" rows="2" placeholder="ระบุระดับน้ำ หรือสิ่งที่ต้องการความช่วยเหลือ..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500"></textarea>
            </div>

            <div>
                <label class="block font-bold text-slate-300 mb-1 flex items-center gap-1.5">
                    <i data-lucide="user" class="w-4 h-4 text-sky-400"></i> 5. ชื่อผู้รายงาน & เบอร์ติดต่อ
                </label>
                <input type="text" id="reporter_name" required placeholder="เช่น ทนพ. กฤษณ์ธนะวัจน์ (เบอร์ 096-170-7533)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-sky-500">
            </div>

            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 font-bold text-white py-3.5 rounded-xl transition-all shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2 text-sm mt-4">
                <i data-lucide="send" class="w-4 h-4"></i> ส่งรายงานเข้า Dashboard หลัก
            </button>
        </form>
    </main>

    <script>
        lucide.createIcons();

        // 📌 CONFIG SUPABASE (ใส่ URL และ ANON KEY ของคุณ)
        const SUPABASE_URL = "https://YOUR_SUPABASE_PROJECT_ID.supabase.co";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const checklists = [];
            if(document.getElementById('chk_water').checked) checklists.push("น้ำท่วมขังรอบอาคาร");
            if(document.getElementById('chk_power').checked) checklists.push("ใช้ไฟสำรอง");
            if(document.getElementById('chk_lab_move').checked) checklists.push("ยกเครื่องมือ Lab แล้ว");
            if(document.getElementById('chk_rad_stop').checked) checklists.push("งดบริการ X-Ray/CT");

            const selectedRisk = document.querySelector('input[name="risk_level"]:checked').value;
            const hospitalName = document.getElementById('hospital_name').value;
            const province = document.getElementById('province').value;
            const district = document.getElementById('district').value;

            const payload = {
                hospital_name: hospitalName,
                province: province,
                district: district,
                risk_level: selectedRisk,
                water_situation: document.getElementById('water_situation').value,
                checklists: checklists.join(", "),
                reporter_name: document.getElementById('reporter_name').value
            };

            const { error } = await supabase.from('hospital_risks').insert([payload]);

            if (!error) {
                alert(`บันทึกข้อมูลของ ${hospitalName} เรียบร้อยแล้ว!\nข้อมูลจะแสดงบน Dashboard หลักทันที`);
                document.getElementById('report-form').reset();
            } else {
                alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
            }
        });
    </script>
</body>
</html>
